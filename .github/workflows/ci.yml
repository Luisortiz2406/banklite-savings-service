# CI de savings-service: revisa estilo (ESLint + Prettier), compila y corre las pruebas.
#
# El despliegue lo hace Railway directamente desde este repositorio (rama main,
# railway.json en la raíz). Este workflow no despliega: solo valida el código en
# pull requests y pushes a main.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Lint, formato, build y pruebas
    runs-on: ubuntu-latest
    # Postgres de prueba: las pruebas con base corren contra una base real (TEST_DATABASE_URL).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Formato (Prettier)
        run: npm run format:check

      - name: Compilar
        run: npm run build

      - name: Pruebas (Jest)
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: npm test --if-present
